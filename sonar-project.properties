# SonarQube Cloud CI-based analysis configuration.
# Project identity is supplied by GitHub repository variables in the workflow.
# Keep this scope aligned with .sonarcloud.properties.

sonar.sources=src,api,scripts,tools,web
sonar.tests=tests,verification,benchmarks

sonar.exclusions=third_party/**,evidence/**,**/node_modules/**,**/*.min.js
sonar.sourceEncoding=UTF-8
