# SonarQube Cloud automatic-analysis scope for GuitarTab Engine.
# Keep first-party production code separate from tests and third-party/evidence noise.

sonar.sources=src,api,scripts,tools,web
sonar.tests=tests,verification,benchmarks

sonar.exclusions=third_party/**,evidence/**,**/node_modules/**,**/*.min.js
sonar.sourceEncoding=UTF-8
