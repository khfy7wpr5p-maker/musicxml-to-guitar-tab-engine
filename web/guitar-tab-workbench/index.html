<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guitar TAB Workbench</title>
  <link rel="stylesheet" href="/workbench/workbench.css">
</head>
<body>
  <main class="workbench" data-guitar-tab-workbench>
    <header class="workbench-toolbar">
      <div class="workbench-title-group">
        <h1>Guitar TAB Workbench</h1>
        <p>Secure MusicXML → standard notation + rhythmic TAB</p>
      </div>
      <label class="workbench-file-label">
        <span>Open MusicXML</span>
        <input data-role="musicxml-file" type="file" accept=".musicxml,.xml,application/vnd.recordare.musicxml+xml,application/xml,text/xml">
      </label>
      <div class="workbench-transport" aria-label="Playback controls">
        <button data-role="play" type="button" disabled>Play</button>
        <button data-role="stop" type="button" disabled>Stop</button>
      </div>
    </header>

    <section class="workbench-meta" aria-live="polite">
      <span>Document: <strong data-role="document-status">EMPTY</strong></span>
      <span>Route: <strong data-role="route-status">UNRESOLVED</strong></span>
      <span>Cursor: <strong data-role="cursor-status">No active measure</strong></span>
    </section>

    <div class="workbench-grid">
      <section class="workbench-score-panel" aria-label="Standard notation and rhythmic TAB">
        <div class="workbench-score" data-role="score"></div>
      </section>

      <aside class="workbench-sidebar" aria-label="Workbench inspector">
        <section class="workbench-editor" aria-label="Structured note editor">
          <div class="workbench-editor__heading">
            <h2>Note editor</h2>
            <strong data-role="selected-note">None</strong>
          </div>
          <p class="workbench-editor__status" data-role="edit-status" aria-live="polite">
            Select a note in the score or TAB.
          </p>
          <div class="workbench-editor__controls">
            <label>
              <span>Step</span>
              <select data-role="edit-step" disabled>
                <option>A</option><option>B</option><option selected>C</option>
                <option>D</option><option>E</option><option>F</option><option>G</option>
              </select>
            </label>
            <label>
              <span>Accidental</span>
              <select data-role="edit-alter" disabled>
                <option value="-2">bb</option>
                <option value="-1">b</option>
                <option value="0" selected>natural</option>
                <option value="1">#</option>
                <option value="2">##</option>
              </select>
            </label>
            <label>
              <span>Octave</span>
              <input data-role="edit-octave" type="number" min="-1" max="9" step="1" value="4" disabled>
            </label>
          </div>
          <div class="workbench-editor__actions">
            <button data-role="apply-edit" type="button" disabled>Apply & regenerate TAB</button>
            <button data-role="cancel-edit" type="button" disabled>Clear selection</button>
          </div>
        </section>

        <section class="workbench-issues" aria-label="MusicXML issues">
          <div class="workbench-issues__heading">
            <h2>Issues</h2>
            <span data-role="issue-count">0</span>
          </div>
          <ol data-role="issues"></ol>
        </section>
      </aside>
    </div>
  </main>

  <script src="/assets/alphatab.js"></script>
  <script src="/workbench/workbench.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-guitar-tab-workbench]');

      const upload = async (file, ownedBytes) => {
        const response = await fetch(`/api/upload?fileName=${encodeURIComponent(file.name)}`, {
          method: 'POST',
          headers: {'content-type': 'application/octet-stream'},
          body: ownedBytes,
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload?.message || 'Upload request failed.');
        return payload;
      };

      const edit = async (request) => {
        const form = new FormData();
        form.append(
          'source',
          new Blob([request.bytes], {type: 'application/vnd.recordare.musicxml+xml'}),
          request.fileName,
        );
        form.append('expectedInputSha256', request.expectedInputSha256);
        form.append('commands', JSON.stringify(request.commands));
        const response = await fetch('/api/edit', {method: 'POST', body: form});
        const payload = await response.json();
        if (!response.ok) throw new Error(payload?.message || 'Edit request failed.');
        return payload;
      };

      window.__workbench = GuitarTabWorkbench.mount({
        root,
        alphaTab: window.alphaTab,
        upload,
        edit,
        assetBaseUrl: '/assets',
        scriptFileUrl: window.location.origin + '/assets/alphatab.js',
        soundFontUrl: window.location.origin + '/assets/soundfont/sonivox.sf2',
      });
    })();
  </script>
</body>
</html>
