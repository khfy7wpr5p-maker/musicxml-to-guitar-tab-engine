name: Manual Runtime Output Capture

on:
  push:
    branches:
      - feature/manual-tuna-runtime-output
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    name: Capture exact application output / Node.js 22
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run exact uploaded MusicXML through application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tuna-runtime-output"
          node --test tests/manualTunaRuntimeOutput.test.js 2>&1 | tee "$RUNNER_TEMP/tuna-runtime-output/application-output.log"

      - name: Upload exact application output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tuna-runtime-output
          path: ${{ runner.temp }}/tuna-runtime-output/application-output.log
          if-no-files-found: error
          retention-days: 2
