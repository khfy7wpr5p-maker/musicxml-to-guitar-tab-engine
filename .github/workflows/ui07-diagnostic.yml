name: UI-07 Diagnostic

on:
  push:
    branches:
      - ui-07-poly-v2-selection-edit-hardening

permissions:
  contents: read

jobs:
  exact-tie-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test --test-name-pattern="requires exact tie-chain identity" tests/ui07PolyV2TieIdentity.test.js

  atomic-tie-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test --test-name-pattern="atomically edits" tests/ui07PolyV2TieIdentity.test.js

  legacy-untied:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test --test-name-pattern="legacy untied" tests/ui07PolyV2TieIdentity.test.js

  browser-static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test tests/ui07PolyV2BrowserIdentity.test.js
