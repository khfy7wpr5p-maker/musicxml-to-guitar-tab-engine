name: A3 let-ring apply

on: [push]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/a3-production-let-ring
          persist-credentials: true

      - name: Stop after implementation commit
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event.head_commit.message }}" = "A3 migration: preserve let-ring notation evidence" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply minimal let-ring representation support
        if: steps.gate.outputs.skip != 'true'
        run: python3 .github/a3-let-ring-apply.py

      - name: Commit implementation
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          if git diff --quiet -- src/parser/polyphonicMusicXmlProjector.js src/music/polyphonicSourceModel.js; then
            echo 'No implementation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/parser/polyphonicMusicXmlProjector.js src/music/polyphonicSourceModel.js
          git commit -m 'A3 migration: preserve let-ring notation evidence'
          git push origin HEAD:feature/a3-production-let-ring
