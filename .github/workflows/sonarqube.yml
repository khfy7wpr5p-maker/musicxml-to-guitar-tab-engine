name: SonarQube Cloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Cloud analysis
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned browser coverage dependency without changing the repository
        run: npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@25.3.0

      - name: Detect a preinstalled Chrome or Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          found=""
          for command in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$command" >/dev/null 2>&1; then
              found="$(command -v "$command")"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "No preinstalled Chrome or Chromium executable was found." >&2
            exit 1
          fi
          echo "BROWSER_EXECUTABLE=$found" >> "$GITHUB_ENV"
          "$found" --version

      - name: Generate LCOV coverage
        run: |
          mkdir -p coverage
          node --test \
            --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=coverage/lcov.info

      - name: Add ReviewTabDraft Workbench browser coverage
        env:
          BROWSER_COVERAGE_LCOV_PATH: coverage/browser.lcov
        run: |
          node tests/compatibility/alphaTabRuntimeHostReviewTabDraftE2e.mjs
          test -s coverage/browser.lcov
          cat coverage/browser.lcov >> coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Diagnose Sonar PR issues
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl --fail --silent --show-error \
            -u "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "pullRequest=${PR_NUMBER}" \
            --data-urlencode "issueStatuses=OPEN,CONFIRMED" \
            --data-urlencode "sinceLeakPeriod=true" \
            --data-urlencode "ps=100" \
            https://sonarcloud.io/api/issues/search \
          | node -e '
              let body = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const payload = JSON.parse(body);
                const issues = Array.isArray(payload.issues) ? payload.issues : [];
                for (const issue of issues) {
                  console.log(JSON.stringify({
                    key: issue.key,
                    rule: issue.rule,
                    severity: issue.severity,
                    type: issue.type,
                    component: issue.component,
                    line: issue.line ?? null,
                    message: issue.message,
                    impacts: issue.impacts ?? null,
                    cleanCodeAttribute: issue.cleanCodeAttribute ?? null,
                  }));
                }
              });
            '
