name: Verification Custom Tuning Admission Apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-tested-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: verification-control
          fetch-depth: 0

      - name: Checkout exact target feature branch
        uses: actions/checkout@v4
        with:
          ref: stage-03/source-custom-tuning-admission
          path: target
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact target head
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "9caf377a20cc6e8439347627fb4b821652c3f779"

      - name: Apply bounded patch
        working-directory: target
        run: python ../verification-control/verification/apply-custom-tuning-pa6.py

      - name: Verify whitelisted feature diff
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/app/musicXmlUploadRuntime.js \
            src/music/deterministicPolyphonicFinalSelector.js \
            src/music/deterministicReductionPlan.js \
            src/music/guitarVoicingCandidateModel.js \
            src/music/sustainedCanonicalFinalSelector.js \
            src/music/sustainedCanonicalSelectionBridgeV1.js \
            src/tab/canonicalTabResultV2.js | sort)"
          test "$changed" = "$expected"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install locked dependencies
        working-directory: target
        run: npm ci

      - name: Run focused regressions
        working-directory: target
        run: node --test tests/deterministicReductionPlanTuning.test.js tests/deterministicReductionPlan.test.js tests/deterministicReductionPlanHardening.test.js tests/customTuningUploadRuntime.test.js tests/guitarConfigurationProvenance.test.js tests/guitarArrangementRegister.test.js tests/musicXmlUploadRuntime.test.js

      - name: Run full regression suite
        working-directory: target
        run: node --test

      - name: Commit and push verified feature revision
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/musicXmlUploadRuntime.js src/music/deterministicReductionPlan.js src/tab/canonicalTabResultV2.js src/music/guitarVoicingCandidateModel.js src/music/deterministicPolyphonicFinalSelector.js src/music/sustainedCanonicalSelectionBridgeV1.js src/music/sustainedCanonicalFinalSelector.js
          git commit -m "Stage 03: admit validated source custom tuning"
          git push origin HEAD:stage-03/source-custom-tuning-admission
