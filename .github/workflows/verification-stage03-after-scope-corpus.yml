name: Verification Stage03 After-Scope Real Corpus

on:
  pull_request:
    branches: [stage-03/legacy-tab-after-scope-guard]

permissions:
  contents: read

jobs:
  real-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "8e2bf4114ed092b8877a2139c2695b956471e866"
          test "$(git rev-parse HEAD)" = "8e2bf4114ed092b8877a2139c2695b956471e866"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Checkout pinned AnimeTAB source
        uses: actions/checkout@v4
        with:
          repository: amamiya-yuuko/AnimeTAB
          ref: 18c0993cbe0a0948cbf0b7768bcb09ff81c23a9a
          path: external-anime-tab
          persist-credentials: false

      - name: Materialize exact nine files by SHA
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = require('./verification/guitar-tech-real-corpus-manifest.json');
          const root = path.resolve('external-anime-tab', 'AnimeTAB', 'Entire songs');
          const out = '/tmp/guitar-tech-corpus';
          fs.mkdirSync(out, { recursive: true });
          const wanted = new Map(manifest.files.map((entry) => [entry.sha256, entry]));
          const found = new Map();
          for (const item of fs.readdirSync(root, { withFileTypes: true })) {
            if (!item.isFile() || !/\.(?:xml|musicxml)$/i.test(item.name)) continue;
            const full = path.join(root, item.name);
            const bytes = fs.readFileSync(full);
            const hash = crypto.createHash('sha256').update(bytes).digest('hex');
            if (wanted.has(hash)) found.set(hash, { full, bytes });
          }
          const mapping = [];
          for (const entry of manifest.files) {
            const match = found.get(entry.sha256);
            if (!match) throw new Error(`Missing exact SHA ${entry.sha256}`);
            fs.writeFileSync(path.join(out, entry.fileName), match.bytes);
            mapping.push({ fileName: entry.fileName, sha256: entry.sha256, sourcePath: path.relative(process.cwd(), match.full) });
          }
          if (mapping.length !== 9) throw new Error(`Expected 9 exact sources, got ${mapping.length}`);
          console.log('CORPUS_MAPPING=' + JSON.stringify(mapping));
          NODE

      - name: Run repository corpus gate twice
        shell: bash
        run: |
          set +e
          node scripts/guitar-tech-real-corpus-gate.js /tmp/guitar-tech-corpus /tmp/report-a.json --engine-commit=8e2bf4114ed092b8877a2139c2695b956471e866 > /tmp/report-a.stdout.json
          A=$?
          node scripts/guitar-tech-real-corpus-gate.js /tmp/guitar-tech-corpus /tmp/report-b.json --engine-commit=8e2bf4114ed092b8877a2139c2695b956471e866 > /tmp/report-b.stdout.json
          B=$?
          set -e
          cmp /tmp/report-a.json /tmp/report-b.json
          echo "GATE_EXIT_A=$A"
          echo "GATE_EXIT_B=$B"
          echo 'GATE_REPORT_BEGIN'
          cat /tmp/report-a.json
          echo 'GATE_REPORT_END'
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/report-a.json', 'utf8'));
          if (!['PASS_NO_UNREVIEWED_DRIFT', 'HOLD_BLOCKER_DIFF_REVIEW_REQUIRED'].includes(report.status)) {
            throw new Error(`Unsafe gate status: ${report.status}`);
          }
          const s = report.summary || {};
          for (const key of ['requiredFiles', 'identityVerifiedFiles', 'deterministicFiles', 'sourceImmutableFiles']) {
            if (s[key] !== 9) throw new Error(`${key} expected 9, got ${s[key]}`);
          }
          NODE

      - name: Capture exact candidate outcomes twice
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = require('./verification/guitar-tech-real-corpus-manifest.json');
          const { processMusicXmlUpload } = require('./src/app/musicXmlUploadRuntime');
          const records = manifest.files.map((entry) => {
            const filePath = path.join('/tmp/guitar-tech-corpus', entry.fileName);
            const bytes = fs.readFileSync(filePath);
            const original = Buffer.from(bytes);
            const beforeHash = crypto.createHash('sha256').update(bytes).digest('hex');
            const first = processMusicXmlUpload({ fileName: entry.fileName, bytes });
            const second = processMusicXmlUpload({ fileName: entry.fileName, bytes });
            assert.deepEqual(first, second, `non-deterministic: ${entry.fileName}`);
            assert.deepEqual(bytes, original, `source mutated in memory: ${entry.fileName}`);
            const afterHash = crypto.createHash('sha256').update(fs.readFileSync(filePath)).digest('hex');
            assert.equal(beforeHash, entry.sha256, `source identity mismatch: ${entry.fileName}`);
            assert.equal(afterHash, entry.sha256, `source file mutated: ${entry.fileName}`);
            const issues = first?.preflight?.issues || [];
            const blocker = issues.find((issue) => issue?.severity === 'error') || issues[0] || null;
            return {
              fileName: entry.fileName,
              sha256: entry.sha256,
              status: first?.status || null,
              route: first?.route || null,
              configuration: first?.guitarConfigurationProvenance || first?.guitarConfiguration || null,
              blocker: blocker ? {
                code: blocker.code || null,
                category: blocker.category || null,
                message: blocker.message || null,
                location: blocker.location || null,
                details: blocker.details || null,
              } : null,
              deterministic: true,
              sourceImmutable: true,
            };
          });
          console.log('CANDIDATE_AUDIT_BEGIN');
          console.log(JSON.stringify({
            engineCommit: '8e2bf4114ed092b8877a2139c2695b956471e866',
            requiredFiles: records.length,
            records,
          }, null, 2));
          console.log('CANDIDATE_AUDIT_END');
          NODE
