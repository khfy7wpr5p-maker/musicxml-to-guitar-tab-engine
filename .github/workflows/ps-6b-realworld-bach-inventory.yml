name: PS-6B Real-world Bach Inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ps-6b-realworld-bach-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pinned public-domain Bach MXL under hard bounds
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/musetrainer/library/9128876f6164d96997c877a2be843349a32bdabb/scores/Bach_Toccata_and_Fugue_in_D_Minor_Piano_solo.mxl'
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 30 --max-filesize 2000000 \
            "$URL" --output /tmp/ps6b-bach.mxl
          size="$(stat -c%s /tmp/ps6b-bach.mxl)"
          test "$size" -gt 0
          test "$size" -le 2000000
          test "$(sha256sum /tmp/ps6b-bach.mxl | cut -d' ' -f1)" = '504e160a588bf1b7cff067dd6855720f0e694830e4fa1c945bd5a1e1265a15b2'

      - name: Extract score XML without executing archive content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import stat
          import zipfile

          source = pathlib.Path('/tmp/ps6b-bach.mxl')
          target = pathlib.Path('/tmp/ps6b-bach.musicxml')
          max_total = 5_000_000
          max_score = 2_000_000
          with zipfile.ZipFile(source) as archive:
              infos = archive.infolist()
              total = 0
              score_info = None
              for info in infos:
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'unsafe symlink: {info.filename}')
                  if info.file_size < 0 or info.file_size > max_total:
                      raise SystemExit(f'unsafe entry size: {info.filename}:{info.file_size}')
                  total += info.file_size
                  if total > max_total:
                      raise SystemExit(f'unsafe archive total: {total}')
                  if info.filename == 'score.xml':
                      score_info = info
              if score_info is None or score_info.file_size > max_score:
                  raise SystemExit('score.xml missing or oversized')
              data = archive.read(score_info)
          if len(data) > max_score:
              raise SystemExit('score.xml read exceeded bound')
          target.write_bytes(data)
          PY

      - name: Inventory parsed MusicXML semantic surfaces
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const { parseParsedMusicXmlDocument } = require('./src/parser/parsedMusicXmlDocument');
          const { createMusicXmlProcessingRuntime } = require('./src/parser/musicxmlSemanticResourceLimits');
          const { projectParsedMusicXmlToPolyphonicSourceModel } = require('./src/parser/polyphonicMusicXmlProjector');

          const xml = fs.readFileSync('/tmp/ps6b-bach.musicxml', 'utf8');
          const runtime = createMusicXmlProcessingRuntime();
          const parsed = parseParsedMusicXmlDocument(xml, {}, runtime);
          const root = parsed.root;
          const direct = (node, name = null) => node.children.filter((child) => child.uri === node.uri && (name === null || child.name === name));
          const countNames = (nodes) => {
            const counts = new Map();
            for (const node of nodes) counts.set(node.name, (counts.get(node.name) || 0) + 1);
            return Object.fromEntries([...counts].sort((a, b) => a[0].localeCompare(b[0])));
          };
          const childrenAcross = (parents) => parents.flatMap((parent) => direct(parent));

          const partLists = direct(root, 'part-list');
          const parts = direct(root, 'part');
          const scoreParts = partLists.flatMap((node) => direct(node, 'score-part'));
          const measures = parts.flatMap((node) => direct(node, 'measure'));
          const attributes = measures.flatMap((node) => direct(node, 'attributes'));
          const notes = measures.flatMap((node) => direct(node, 'note'));
          const notations = notes.flatMap((node) => direct(node, 'notations'));
          const articulations = notations.flatMap((node) => direct(node, 'articulations'));
          const technical = notations.flatMap((node) => direct(node, 'technical'));
          const directions = measures.flatMap((node) => direct(node, 'direction'));
          const directionTypes = directions.flatMap((node) => direct(node, 'direction-type'));

          const inventory = {
            rootChildren: countNames(direct(root)),
            partListChildren: countNames(childrenAcross(partLists)),
            scorePartChildren: countNames(childrenAcross(scoreParts)),
            measureChildren: countNames(childrenAcross(measures)),
            attributeChildren: countNames(childrenAcross(attributes)),
            noteChildren: countNames(childrenAcross(notes)),
            notationChildren: countNames(childrenAcross(notations)),
            articulationChildren: countNames(childrenAcross(articulations)),
            technicalChildren: countNames(childrenAcross(technical)),
            directionTypeChildren: countNames(childrenAcross(directionTypes)),
            measureCount: measures.length,
            noteCount: notes.length,
          };
          console.log(`PS6B_INVENTORY=${JSON.stringify(inventory)}`);

          try {
            projectParsedMusicXmlToPolyphonicSourceModel(parsed, runtime);
            console.log('PS6B_STRICT_PROJECTOR=PASS');
          } catch (error) {
            console.log(`PS6B_STRICT_PROJECTOR=${JSON.stringify({code:error?.code,message:error?.message,details:error?.details})}`);
          }

          const safeRootMetadata = new Set(['work','movement-number','movement-title','identification','defaults','credit']);
          const sanitized = {
            documentType: parsed.documentType,
            contractVersion: parsed.contractVersion,
            root: {
              ...root,
              attributes: root.attributes.map((attribute) => ({...attribute})),
              children: root.children
                .filter((child) => child.uri !== root.uri || !safeRootMetadata.has(child.name))
                .map((child) => child),
            },
          };
          try {
            projectParsedMusicXmlToPolyphonicSourceModel(sanitized, createMusicXmlProcessingRuntime());
            console.log('PS6B_AFTER_ROOT_METADATA=PASS');
          } catch (error) {
            console.log(`PS6B_AFTER_ROOT_METADATA=${JSON.stringify({code:error?.code,message:error?.message,details:error?.details})}`);
          }
          NODE
