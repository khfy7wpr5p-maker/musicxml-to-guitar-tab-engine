name: PS-6B Post-presentation Bach Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ps-6b-post-presentation-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pinned public-domain Bach MXL under hard bounds
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/musetrainer/library/9128876f6164d96997c877a2be843349a32bdabb/scores/Bach_Toccata_and_Fugue_in_D_Minor_Piano_solo.mxl'
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 30 --max-filesize 2000000 \
            "$URL" --output /tmp/ps6b-bach.mxl
          size="$(stat -c%s /tmp/ps6b-bach.mxl)"
          test "$size" -gt 0
          test "$size" -le 2000000
          test "$(sha256sum /tmp/ps6b-bach.mxl | cut -d' ' -f1)" = '504e160a588bf1b7cff067dd6855720f0e694830e4fa1c945bd5a1e1265a15b2'

      - name: Extract score XML without executing archive content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import stat
          import zipfile

          source = pathlib.Path('/tmp/ps6b-bach.mxl')
          target = pathlib.Path('/tmp/ps6b-bach.musicxml')
          max_total = 5_000_000
          max_score = 2_000_000
          with zipfile.ZipFile(source) as archive:
              infos = archive.infolist()
              total = 0
              score_info = None
              for info in infos:
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'unsafe symlink: {info.filename}')
                  if info.file_size < 0 or info.file_size > max_total:
                      raise SystemExit(f'unsafe entry size: {info.filename}:{info.file_size}')
                  total += info.file_size
                  if total > max_total:
                      raise SystemExit(f'unsafe archive total: {total}')
                  if info.filename == 'score.xml':
                      score_info = info
              if score_info is None or score_info.file_size > max_score:
                  raise SystemExit('score.xml missing or oversized')
              data = archive.read(score_info)
          if len(data) > max_score:
              raise SystemExit('score.xml read exceeded bound')
          target.write_bytes(data)
          PY

      - name: Probe first remaining semantic boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const { parseParsedMusicXmlDocument } = require('./src/parser/parsedMusicXmlDocument');
          const { createMusicXmlProcessingRuntime } = require('./src/parser/musicxmlSemanticResourceLimits');
          const {
            normalizePolyphonicPresentationMetadata,
            projectParsedMusicXmlWithPresentationCompatibility,
          } = require('./src/parser/polyphonicPresentationMetadataNormalizer');

          const xml = fs.readFileSync('/tmp/ps6b-bach.musicxml', 'utf8');
          const parseRuntime = createMusicXmlProcessingRuntime();
          const parsed = parseParsedMusicXmlDocument(xml, {}, parseRuntime);
          const normalization = normalizePolyphonicPresentationMetadata(
            parsed,
            createMusicXmlProcessingRuntime(),
          );
          console.log(`PS6B_PRESENTATION_IGNORED=${JSON.stringify(normalization.ignoredFeatures)}`);
          try {
            const projected = projectParsedMusicXmlWithPresentationCompatibility(
              parsed,
              createMusicXmlProcessingRuntime(),
            );
            console.log(`PS6B_POST_PRESENTATION_PROJECTOR=${JSON.stringify({
              status: 'PASS',
              measureCount: projected.sourceModel.measureCount,
              eventCount: projected.sourceModel.eventCount,
              ignoredFeatures: projected.ignoredFeatures,
            })}`);
          } catch (error) {
            console.log(`PS6B_POST_PRESENTATION_PROJECTOR=${JSON.stringify({
              status: 'BLOCKED',
              name: error?.name,
              code: error?.code,
              message: error?.message,
              details: error?.details,
            })}`);
          }
          NODE
