name: PS-6B Real-world Bach Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ps-6b-realworld-bach-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pinned public-domain Bach MXL under hard bounds
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/musetrainer/library/9128876f6164d96997c877a2be843349a32bdabb/scores/Bach_Toccata_and_Fugue_in_D_Minor_Piano_solo.mxl'
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 30 --max-filesize 2000000 \
            "$URL" --output /tmp/ps6b-bach.mxl
          size="$(stat -c%s /tmp/ps6b-bach.mxl)"
          test "$size" -gt 0
          test "$size" -le 2000000
          echo "PS6B_MXL_BYTES=$size"
          sha256sum /tmp/ps6b-bach.mxl

      - name: Extract score XML without executing archive content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import stat
          import zipfile

          source = pathlib.Path('/tmp/ps6b-bach.mxl')
          target = pathlib.Path('/tmp/ps6b-bach.musicxml')
          max_total = 5_000_000
          max_score = 2_000_000

          with zipfile.ZipFile(source) as archive:
              infos = archive.infolist()
              total = 0
              score_info = None
              for info in infos:
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'PS6B_UNSAFE_SYMLINK={info.filename}')
                  if info.file_size < 0 or info.file_size > max_total:
                      raise SystemExit(f'PS6B_UNSAFE_ENTRY_SIZE={info.filename}:{info.file_size}')
                  total += info.file_size
                  if total > max_total:
                      raise SystemExit(f'PS6B_UNSAFE_ARCHIVE_TOTAL={total}')
                  if info.filename == 'score.xml':
                      score_info = info
              if score_info is None:
                  raise SystemExit('PS6B_SCORE_XML_MISSING')
              if score_info.file_size > max_score:
                  raise SystemExit(f'PS6B_SCORE_XML_TOO_LARGE={score_info.file_size}')
              data = archive.read(score_info)

          if len(data) > max_score:
              raise SystemExit(f'PS6B_SCORE_XML_READ_TOO_LARGE={len(data)}')
          target.write_bytes(data)
          print(f'PS6B_ARCHIVE_ENTRIES={len(infos)}')
          print(f'PS6B_ARCHIVE_UNCOMPRESSED_BYTES={total}')
          print(f'PS6B_SCORE_XML_BYTES={len(data)}')
          PY

      - name: Probe real-world structure and current sustained-solver boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';

          const fs = require('node:fs');
          const {
            parseParsedMusicXmlDocument,
          } = require('./src/parser/parsedMusicXmlDocument');
          const {
            createMusicXmlProcessingRuntime,
          } = require('./src/parser/musicxmlSemanticResourceLimits');
          const {
            projectParsedMusicXmlToPolyphonicSourceModel,
          } = require('./src/parser/polyphonicMusicXmlProjector');
          const {
            createSustainedPolyphonicPathSelection,
          } = require('./src/music/sustainedPolyphonicPathSolver');

          const xml = fs.readFileSync('/tmp/ps6b-bach.musicxml', 'utf8');
          const matches = (pattern) => [...xml.matchAll(pattern)];
          const voices = matches(/<voice>([^<]+)<\/voice>/g).map((match) => match[1].trim());
          const staves = matches(/<staff>([^<]+)<\/staff>/g).map((match) => match[1].trim());
          const software = matches(/<software>([^<]+)<\/software>/g).map((match) => match[1].trim());
          const doctype = xml.match(/<!DOCTYPE[^>]*>/i)?.[0] || null;
          const summary = {
            bytes: Buffer.byteLength(xml, 'utf8'),
            hasDoctype: doctype !== null,
            doctype,
            software: [...new Set(software)],
            scorePartCount: matches(/<score-part\b/g).length,
            partCount: matches(/<part\s+id=/g).length,
            noteCount: matches(/<note\b/g).length,
            backupCount: matches(/<backup\b/g).length,
            forwardCount: matches(/<forward\b/g).length,
            tieCount: matches(/<tie\b/g).length,
            graceCount: matches(/<grace\b/g).length,
            timeModificationCount: matches(/<time-modification\b/g).length,
            chordMarkerCount: matches(/<chord\s*\/>/g).length,
            voices: [...new Set(voices)].sort(),
            staves: [...new Set(staves)].sort(),
          };
          console.log(`PS6B_SOURCE_SUMMARY=${JSON.stringify(summary)}`);

          function runPipeline(input) {
            const stage = { parse: null, project: null, solve: null };
            try {
              const runtime = createMusicXmlProcessingRuntime();
              const parsed = parseParsedMusicXmlDocument(input, {}, runtime);
              stage.parse = { status: 'PASS' };
              const source = projectParsedMusicXmlToPolyphonicSourceModel(parsed, runtime);
              stage.project = {
                status: 'PASS',
                measureCount: source.measureCount,
                eventCount: source.eventCount,
                voices: [...new Set(source.measures.flatMap((measure) => (
                  measure.events.map((event) => event.voice)
                )))].sort(),
              };
              const selection = createSustainedPolyphonicPathSelection(source, runtime);
              stage.solve = {
                status: 'PASS',
                pointCount: selection.pointCount,
                selectedLogicalNoteCount: selection.selectedLogicalNoteCount,
                fingerSubstitutionCount: selection.fingerSubstitutionCount,
                pathStateCount: selection.pathStateCount,
              };
            } catch (error) {
              const failure = {
                status: 'BLOCKED',
                name: error && error.name,
                code: error && error.code,
                message: error && error.message,
                details: error && error.details,
              };
              if (!stage.parse) stage.parse = failure;
              else if (!stage.project) stage.project = failure;
              else stage.solve = failure;
            }
            return stage;
          }

          console.log(`PS6B_PIPELINE_RAW=${JSON.stringify(runPipeline(xml))}`);

          const historical31 = /^(\uFEFF?\s*(?:<\?xml\b[^?]*\?>\s*)?)<!DOCTYPE\s+score-partwise\s+PUBLIC\s+(['"])-\/\/Recordare\/\/DTD MusicXML 3\.1 Partwise\/\/EN\2\s+(['"])http:\/\/www\.musicxml\.org\/dtds\/partwise\.dtd\3\s*>(?=\s*<score-partwise(?:\s|>))/i;
          const historicalMatch = historical31.exec(xml);
          console.log(`PS6B_HISTORICAL_31_DOCTYPE_MATCH=${historicalMatch !== null}`);
          if (historicalMatch) {
            const withoutHistoricalDoctype = historicalMatch[1] + xml.slice(historicalMatch[0].length);
            console.log(`PS6B_PIPELINE_AFTER_EXACT_31_STRIP=${JSON.stringify(runPipeline(withoutHistoricalDoctype))}`);
          }
          NODE
