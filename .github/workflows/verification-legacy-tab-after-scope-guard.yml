name: Verification Legacy TAB After-Scope Guard

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: verification-control
          fetch-depth: 0

      - name: Checkout exact production-derived target
        uses: actions/checkout@v4
        with:
          ref: stage-03/legacy-tab-after-scope-guard
          path: target
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact target base
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "ac4a0310d6ce55d9d5395b7158eb35a66285dffa"

      - name: Apply bounded after-scope fail-closed patch
        working-directory: target
        run: python ../verification-control/verification/apply-legacy-tab-after-scope-guard.py

      - name: Verify bounded diff
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/app/musicXmlUploadRuntime.js tests/customTuningUploadRuntime.test.js | sort)"
          test "$changed" = "$expected"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install locked dependencies
        working-directory: target
        run: npm ci

      - name: Verify exact PR298 compatibility regression
        working-directory: target
        run: node --test --test-name-pattern="COMPAT-01C Guitar Pro export-profile provenance follows MONO guitar register semantics without trusting source TAB fingering" tests/guitarProCompatibilityCorpus.test.js

      - name: Verify exact after-scope regressions
        working-directory: target
        run: node --test --test-name-pattern="lone reversed legacy TAB tuning after solve scope remains fail-closed|lone partial legacy TAB tuning after timing starts remains fail-closed" tests/customTuningUploadRuntime.test.js

      - name: Run fail-closed and custom-tuning focused regressions
        working-directory: target
        run: node --test tests/customTuningUploadRuntime.test.js tests/guitarProCompatibilityCorpus.test.js tests/runtimeRealWorldGuitarPoly.test.js tests/guitarConfigurationProvenance.test.js tests/guitarConfigurationCapoRestatement.test.js

      - name: Run full regression suite
        working-directory: target
        run: node --test

      - name: Commit and push verified production fix
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/musicXmlUploadRuntime.js tests/customTuningUploadRuntime.test.js
          git commit -m "Stage 03: reject legacy TAB fallback after solve start"
          git push origin HEAD:stage-03/legacy-tab-after-scope-guard
