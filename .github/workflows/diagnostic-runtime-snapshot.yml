name: Diagnostic Runtime Snapshot

on:
  push:
    branches:
      - compat/grace-legato-anchor-normalization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Package runtime snapshot
        run: |
          tar -czf engine-runtime-snapshot.tgz \
            src scripts package.json package-lock.json node_modules
      - name: Upload runtime snapshot
        uses: actions/upload-artifact@v4
        with:
          name: engine-runtime-snapshot
          path: engine-runtime-snapshot.tgz
          if-no-files-found: error
          retention-days: 1
